version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      test-tooling:
        patterns:
          - "vitest"
          - "jsdom"
          - "@testing-library/react"
          - "@testing-library/user-event"
          - "@vitejs/plugin-react"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
