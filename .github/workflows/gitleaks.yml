name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is deliberate — a shallow checkout would only scan the
      # latest commit, missing anything in earlier history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This repo is public, so no GITLEAKS_LICENSE is required.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
