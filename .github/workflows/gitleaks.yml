name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is deliberate — a shallow checkout would only scan the
      # latest commit, missing anything in earlier history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This repo is public, so no GITLEAKS_LICENSE is required.
      # v3 is required for the Node 24 runtime: GitHub removes Node 20 from
      # hosted runners on 2026-09-16, after which v2 stops running entirely.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
